name: ci
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: tools
        run: |
          go install github.com/bufbuild/buf/cmd/buf@v1.75.0
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
      - name: lint
        run: buf lint
      - name: breaking
        if: github.event_name == 'pull_request'
        run: buf breaking --against ".git#branch=origin/${{ github.base_ref }}"
      - name: generated code is current
        run: |
          buf generate
          git diff --exit-code -- gen || { echo "run make generate and commit gen/"; exit 1; }
  test:
    uses: ahmedbaig/go-backend-pipelines/.github/workflows/go-ci.yml@main
  release:
    needs: [proto, test]
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ahmedbaig/go-backend-pipelines/.github/workflows/release.yml@main
    permissions:
      contents: write
